<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
  aria-label="Minimum CPU">
  <!--
    A late-stage board, at 64 units to the 4x4 cells the mark is laid out on.

    Two registered parts, a big one and a small one, packed into a corner, with a wire routed
    through the rows and columns they left over. That is the shape every board takes from around
    the twentieth stage onward, and it is the whole game in three elements.

    The colours are the site's own tokens: accent for the parts, the wire-on green for the wire,
    and the dark theme's background for the ground. Three elements is the budget, because in a
    browser tab this is drawn at 16px, where the wire is 3px wide and anything more becomes mud.

    Keep a double hyphen out of this comment. XML forbids one inside a comment, and a favicon
    that fails to parse does not warn: the tab just shows a blank icon.
  -->
  <rect width="64" height="64" rx="14" fill="#0b0f19" />
  <rect x="8" y="8" width="32" height="24" rx="5" fill="#2563eb" />
  <rect x="8" y="38" width="14" height="18" rx="3" fill="#2563eb" />
  <path d="M50 14V50H30" fill="none" stroke="#16a34a" stroke-width="12"
    stroke-linecap="round" stroke-linejoin="round" />
</svg>
